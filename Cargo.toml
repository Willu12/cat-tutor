[package]
name = "cat-tutor"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["console", "Window", "Document", "HtmlElement", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "Performance"] }

[lib]
crate-type = ["cdylib", "rlib"]
